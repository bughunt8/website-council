name: S2 Council deploy
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    name: Publish and verify exact revision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require the exact environment and project
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID environment variable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN environment secret"; exit 1; }
          if [ "$DEPLOY_ENVIRONMENT" = staging ]; then
            expected=website-council-staging
            test "$GITHUB_REF" = refs/heads/staging
          elif [ "$DEPLOY_ENVIRONMENT" = production ]; then
            expected=website-council
            test "$GITHUB_REF" = refs/heads/main
          else
            echo "::error::Unsupported environment"; exit 1
          fi
          test "$PAGES_PROJECT" = "$expected" || { echo "::error::Project does not match environment"; exit 1; }
      - run: npm ci
      - name: Assemble only the public static output
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = staging ]; then
            COUNCIL_STAGING=1 npm run build
          else
            npm run build
          fi
      - name: Upload to the isolated Pages project
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Verify the Pages host serves this exact commit
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "https://${PAGES_PROJECT}.pages.dev/release.json?revision=${GITHUB_SHA}" | \
              jq -e --arg sha "$GITHUB_SHA" '.revision == $sha and .mode == "public-static-viewer"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages host is not serving the deployed commit"; exit 1
      - name: Verify active production custom domain
        if: ${{ inputs.environment == 'production' && vars.CUSTOM_DOMAIN_ACTIVE == 'true' }}
        run: |
          curl -fsS "https://council.ronald.ng/release.json?revision=${GITHUB_SHA}" | \
            jq -e --arg sha "$GITHUB_SHA" '.revision == $sha'
