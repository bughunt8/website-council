name: S2 Council Cloudflare staging deploy
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    name: Publish and verify exact revision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require the staging branch and isolated project
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID environment variable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN environment secret"; exit 1; }
          test "$DEPLOY_ENVIRONMENT" = staging || { echo "::error::Pages is staging-only"; exit 1; }
          test "$GITHUB_REF" = refs/heads/staging
          test "$PAGES_PROJECT" = website-council-staging || { echo "::error::Project does not match staging"; exit 1; }
      - run: npm ci
      - name: Assemble only the public static output
        run: |
          COUNCIL_STAGING=1 npm run build
      - name: Upload to the isolated Pages project
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Verify the Pages host serves this exact commit
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "https://${PAGES_PROJECT}.pages.dev/release.json?revision=${GITHUB_SHA}" | \
              jq -e --arg sha "$GITHUB_SHA" '.revision == $sha and .mode == "public-static-viewer" and .canonicalHost == "council.profitriseco.com" and .environment == "staging"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages host is not serving the deployed commit"; exit 1
