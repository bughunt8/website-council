name: B2 Council production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/s1-validate.yml
  deploy:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/s3-aws-deploy.yml
