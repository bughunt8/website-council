name: B2 Council immutable executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: council-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/s1-validate.yml
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ghcr.io/bughunt8/council:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - run: echo "Council executable digest ${{ steps.image.outputs.digest }}. Private Backend owns activation, data, configuration and ingress."
