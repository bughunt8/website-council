name: S1 Council validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Council gates passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: council-test-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
